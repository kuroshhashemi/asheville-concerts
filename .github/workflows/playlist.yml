name: Update concerts playlist
on:
  schedule:
    - cron: '47 12 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: concert-catalog
  cancel-in-progress: false
jobs:
  playlist:
    if: vars.SPOTIFY_PLAYLIST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Update shared playlist
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python -m concert_discovery.playlist --publish
      - name: Preserve weekly track cache
        if: always()
        run: |
          git config user.name 'Concert playlist'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f concert_discovery/assets/playlist-tracks.json; then
            git add concert_discovery/assets/playlist-tracks.json
            if ! git diff --cached --quiet; then
              git commit -m 'Cache playlist track choices'
              git push
            fi
          fi
