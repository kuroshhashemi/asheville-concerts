<!doctype html><html><head><style>

</style></head><body><button id="email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/></svg><span>Emails · <span id="state"></span></span></button><div id="tip" role="tooltip" hidden>Email me a list of new live music discovered that week</div><script>
const send=(type,extra)=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');let args={},pending=null;const button=document.getElementById('email'),state=document.getElementById('state'),tip=document.getElementById('tip');function paint(on){state.textContent=on?'On':'Off';state.className=on?'on':'off'}function help(show){try{const doc=parent.document;let popup=doc.getElementById('soundcheck-email-tip');if(!popup){popup=doc.createElement('div');popup.id='soundcheck-email-tip';popup.textContent=tip.textContent;popup.style.cssText='position:fixed;z-index:999999;width:220px;background:#102c43;color:white;padding:14px 16px;border-radius:16px;box-shadow:0 8px 20px #102c4340;font:600 13px system-ui;line-height:1.45;pointer-events:none;transform:translateX(-100%)';doc.body.append(popup)}const frame=window.frameElement.getBoundingClientRect();popup.style.left=frame.right+'px';popup.style.top=(frame.top+49)+'px';popup.hidden=!show;}catch(e){tip.hidden=!show;send('streamlit:setFrameHeight',{height:show?145:44})}}button.onmouseenter=()=>help(true);button.onmouseleave=()=>help(false);button.onfocus=()=>help(true);button.onblur=()=>help(false);button.onclick=()=>{help(false);if(args.unavailable)return;const id=Date.now()+'-'+Math.random();if(!args.account_id){send('streamlit:setComponentValue',{value:{login_requested:true,event_id:id},dataType:'json'});return;}if(pending)return;pending={enabled:!args.enabled,event_id:id};paint(pending.enabled);button.animate([{transform:'scale(.96)'},{transform:'scale(1.03)'},{transform:'scale(1)'}],{duration:200});send('streamlit:setComponentValue',{value:pending,dataType:'json'})};addEventListener('message',e=>{if(e.data.type==='streamlit:render'){args=e.data.args;if(pending&&args.ack===pending.event_id)pending=null;paint(pending?pending.enabled:args.enabled);button.disabled=!!args.unavailable;}});send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:44});
</script></body></html>
