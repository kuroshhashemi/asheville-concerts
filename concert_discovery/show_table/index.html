<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,-apple-system,sans-serif;color:#17202a;background:transparent}.scroll{overflow:auto;border:1px solid #e3e7ec;border-radius:10px;max-height:700px}table{border-collapse:collapse;width:100%;min-width:920px}th{position:sticky;top:0;background:#f5f7fa;text-align:left;font-size:12px;color:#526071;padding:13px 12px;z-index:2;white-space:nowrap}td{padding:11px 12px;border-top:1px solid #edf0f3;vertical-align:middle}tr:hover td{background:#f8fafc}.identity{display:flex;align-items:center;gap:9px}.artist{width:28px;height:28px;border-radius:50%;object-fit:cover}.venue{width:18px;height:18px;object-fit:contain}.name{min-width:190px;font-weight:550}.audience{position:relative;min-width:150px;height:29px;border-radius:4px;overflow:hidden;background:#f4f6f8}.bar{position:absolute;inset:0 auto 0 0;background:#c5e5dd}.count{position:relative;display:block;padding:5px 9px;font-variant-numeric:tabular-nums}.date{white-space:nowrap}.genre{color:#566372;font-size:12px;max-width:170px}select{font:inherit;border:1px solid #a9b5c2;border-radius:6px;background:#fff;color:#263a51;padding:6px 25px 6px 8px;cursor:pointer;min-width:113px}select:focus{outline:2px solid #69a9e0;outline-offset:1px}select[data-status=Interested]{background:#eaf6ed;border-color:#82b78c}select[data-status=Pass]{color:#6f7781;background:#f1f2f4}a{color:#246d87;text-decoration:none;white-space:nowrap}a:hover{text-decoration:underline}.links{display:flex;gap:12px}.foot{font-size:12px;color:#637286;padding:9px 0} @media(prefers-color-scheme:dark){body{color:#e6ebf0}th{background:#202733;color:#b6c2cf}td{border-color:#303845}tr:hover td{background:#252c35}.scroll{border-color:#394250}.genre,.foot{color:#b3bfcb}.audience{background:#28333d}.bar{background:#28564f}select{background:#273240;color:#e6ebf0}}
</style></head><body><div class="scroll"><table><thead><tr><th>Date</th><th>Artist</th><th>Venue</th><th>Genre</th><th>Monthly listeners</th><th>Status ▾</th><th>Links</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot">Choose a status from its dropdown to save it. Listener bars use the largest audience in this view as their scale.</div><script>
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function text(tag,value,cls){const el=document.createElement(tag);el.textContent=value??'';if(cls)el.className=cls;return el}
function image(url,cls){if(!url||!/^https:\/\//.test(url))return null;const el=document.createElement('img');el.src=url;el.className=cls;el.alt='';el.loading='lazy';el.onerror=()=>el.remove();return el}
function identity(label,url,cls){const wrap=text('div',null,'identity');const img=image(url,cls);if(img)wrap.append(img);wrap.append(text('span',label));return wrap}
function link(label,url){const el=text('a',label);if(/^https:\/\//.test(url||'')){el.href=url;el.target='_blank';el.rel='noopener noreferrer'}return el}
const storageKey='worth-a-listen:default-user:statuses:v1';let decisions={};try{decisions=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}let loaded=false;
window.addEventListener('message',ev=>{if(ev.data.type!=='streamlit:render')return;const args=ev.data.args;if(!loaded){loaded=true;send('streamlit:setComponentValue',{value:{decisions,event_id:'load-'+Date.now()},dataType:'json'})}const body=document.getElementById('rows');body.replaceChildren();const max=Math.max(1,...args.rows.map(r=>r.listeners||0));for(const r of args.rows){const tr=document.createElement('tr');const add=(node,cls)=>{const td=document.createElement('td');if(cls)td.className=cls;td.append(node);tr.append(td)};add(text('span',r.date),'date');add(identity(r.name,r.artist_image,'artist'),'name');add(identity(r.venue,r.venue_icon,'venue'));add(text('span',r.genre),'genre');const audience=text('div',null,'audience');if(r.listeners!==null){const bar=text('div',null,'bar');bar.style.width=Math.max(0,r.listeners/max*100)+'%';audience.append(bar)}audience.append(text('span',r.listeners_label,'count'));add(audience);const select=document.createElement('select');select.setAttribute('aria-label','Status for '+r.name+' on '+r.date);select.dataset.status=r.status;for(const status of ['Unread','Pass','Interested']){const option=text('option',status);option.value=status;option.selected=status===r.status;select.append(option)}select.onchange=()=>{select.dataset.status=select.value;decisions[r.id]=select.value;try{localStorage.setItem(storageKey,JSON.stringify(decisions))}catch(e){}send('streamlit:setComponentValue',{value:{decisions,event_id:Date.now()+Math.random()},dataType:'json'})};add(select);const links=text('div',null,'links');links.append(link('Listen ↗',r.listen),link('Buy ↗',r.buy));add(links);body.append(tr)}send('streamlit:setFrameHeight',{height:Math.min(745,document.body.scrollHeight+5)})});send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
