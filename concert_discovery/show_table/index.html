function syncHeader(){try{const frame=window.frameElement;if(!frame)return;const rect=frame.getBoundingClientRect();const parentDoc=window.parent.document;const appHeader=parentDoc.querySelector('[data-testid="stHeader"]');const top=appHeader?Math.max(0,appHeader.getBoundingClientRect().bottom):0;const table=document.querySelector('table');const head=table.querySelector('thead');const offset=Math.max(0,Math.min(top-rect.top,table.offsetHeight-head.offsetHeight));for(const th of head.querySelectorAll('th'))th.style.transform='translateY('+offset+'px)';}catch(e){}}
try{window.parent.document.addEventListener('scroll',syncHeader,true);window.parent.addEventListener('resize',syncHeader);new ResizeObserver(syncHeader).observe(document.body);}catch(e){}
for(const header of document.querySelectorAll('th[data-sort]')){header.querySelector('button').onclick=()=>{sortDirection=sortKey===header.dataset.sort?-sortDirection:(['listeners','growth'].includes(header.dataset.sort)?-1:1);sortKey=header.dataset.sort;for(const h of document.querySelectorAll('th[data-sort]')){const active=h.dataset.sort===sortKey;h.setAttribute('aria-sort',active?(sortDirection===1?'ascending':'descending'):'none');h.querySelector('.sort-arrow').textContent=active?(sortDirection===1?'↑':'↓'):'↕'}if(currentArgs)render(currentArgs)}}
document.querySelector('#spotify-player button').onclick=()=>{const panel=document.getElementById('spotify-player');panel.hidden=true;panel.querySelector('iframe').src='';};
window.addEventListener('message',ev=>{if(ev.data.type==='streamlit:render')render(ev.data.args)});new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+5})).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
