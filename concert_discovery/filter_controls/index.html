<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;color:#102c43;font:13px system-ui,-apple-system,sans-serif;background:transparent}button,input{font:inherit}button{cursor:pointer}#views{display:flex;gap:22px;border-bottom:1px solid #e1e7eb;flex-wrap:wrap;margin-bottom:20px}#views button{border:0;border-bottom:3px solid transparent;background:transparent;padding:10px 3px;color:#71808b;font-weight:600}#views button[aria-selected=true]{border-bottom-color:#102c43;color:#102c43}.badge{display:inline-block;margin-left:6px;background:#e6ecef;color:#526071;border-radius:999px;font-size:11px;font-weight:600;padding:1px 6px}#filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{height:42px;border:1px solid transparent;border-radius:999px;background:#f0f4f6;color:#63717d;padding:0 12px;display:flex;align-items:center;gap:5px;white-space:nowrap}.pill:hover,.pill[aria-expanded=true]{background:#e7f0f1;border-color:#b2c8cb}.pill strong{font-weight:600;color:#102c43}.pill .value.restricted{color:#247e79}.chevron{width:12px;height:12px;margin-left:2px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}.search{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid transparent;border-radius:999px;background:#f0f4f6;width:220px;min-width:150px}.search:focus-within{border-color:#247e79;background:#e7f0f1}.search>svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;fill:none}.search input{border:0;outline:0;min-width:0;width:100%;color:#102c43;background:transparent}.search input::-webkit-search-cancel-button{display:none}.search button{border:0;background:transparent;color:#63717d;border-radius:50%;width:22px;height:22px;font-size:20px;padding:0}.search button[hidden]{display:none}:focus-visible{outline:2px solid #247e79;outline-offset:3px}@media(prefers-color-scheme:dark){body{color:#e4f3ef}#views button{color:#b5c6ce}#views button[aria-selected=true]{color:#e4f3ef;border-b .mobile #views button:not([data-view="To Review"]):not([data-view="All"]){display:none}.mobile #views{margin-bottom:12px}</style></head><body><div id="views" role="tablist" aria-label="Your shows"></div><div id="filters"></div><script src="client_filters.js"></script><script src="motion.js"></script><script>
const send=(type,extra={})=>parent.postMessage({isStreamlitMessage:true,type,...extra},'*');
let args=null,state=null,revision=0,owner=null,timer=null,popover=null,active=null;
const root=window.parent,model=SoundcheckFilters,doc=root.document;
const style=doc.createElement('style');style.id='soundcheck-filter-popover-style';style.textContent=`
.soundcheck-filter-popover{position:fixed;z-index:1000000;width:310px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto;box-sizing:border-box;border:1px solid #dbe3e8;border-radius:18px;background:#fff;color:#102c43;padding:16px;box-shadow:0 8px 30px #102c4326;font:13px system-ui,-apple-system,sans-serif}.soundcheck-filter-popover *{box-sizing:border-box}.soundcheck-filter-popover label.option{display:flex;align-items:center;gap:9px;min-height:33px;cursor:pointer}.soundcheck-filter-popover input[type=checkbox]{width:17px;height:17px;accent-color:#247e79;cursor:pointer}.soundcheck-filter-popover .badge{background:#eef0f3;border-radius:999px;padding:1px 7px;font-size:11px;color:#526071;margin-left:auto}.soundcheck-filter-popover .separator{border-top:1px solid #dbe3e8;margin:6px 0}.soundcheck-filter-popover .group{font-size:12px;color:#63717d;margin:12px 0 5px}.soundcheck-filter-popover .range-title{font-weight:600;margin:0 0 14px}.soundcheck-filter-popover .range-values{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600;margin:8px 0}.soundcheck-filter-popover .range-track{height:32px;position:relative;margin:4px 0 8px}.soundcheck-filter-popover .range-line{position:absolute;top:14px;left:0;right:0;height:4px;border-radius:4px;background:#dce8e6}.soundcheck-filter-popover input[type=range]{position:absolute;inset:0;width:100%;height:32px;margin:0;background:none;appearance:none;pointer-events:none}.soundcheck-filter-popover input[type=range]::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:#247e79;border:2px solid white;box-shadow:0 0 0 1px #247e79;pointer-events:auto;cursor:grab}.soundcheck-filter-popover input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#247e79;pointer-events:auto;cursor:grab}.soundcheck-filter-popover input:focus-visible{outline:2px solid #247e79;outline-offset:2px}.soundcheck-filter-popover .scale{display:flex;justify-content:space-between;color:#71808b;font-size:12px;margin-bottom:12px}.soundcheck-filter-popover input[type=range]:focus-visible{outline:0}.soundcheck-filter-popover input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px #bde6de}.soundcheck-filter-popover h3{font:600 13px system-ui;margin:0 0 8px}@media(prefers-color-scheme:dark){.soundcheck-filter-popover{background:#233843;color:#e4f3ef;border-color:#405660}.soundcheck-filter-popover .badge{background:#314752;color:#c5d6de}.soundcheck-filter-popover .group,.soundcheck-filter-popover .scale{color:#b5c6ce}}
`;
if(!doc.getElementById(style.id))doc.head.append(style);
const buttons={},tabs={};
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;}
for(const view of model.views){const b=el('button');b.type='button';b.setAttribute('role','tab');b.dataset.view=view;b.append(el('span',view),el('span','0','badge'));b.onclick=()=>change({review_view:view});tabs[view]=b;document.getElementById('views').append(b);}
for(const [facet,label] of [['venue','Venues'],['listeners','Listeners'],['growth','Trending'],['type','Type'],['genre','Genre']]){const b=el('button',null,'pill');b.type='button';b.setAttribute('aria-expanded','false');b.setAttribute('aria-haspopup','dialog');b.append(el('strong',label),el('span','·'),el('span','','value'));if(facet==='listeners')b.append(el('span','','unknown-note'));const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 12 12');svg.setAttribute('class','chevron');svg.innerHTML='<path d="m3 4.5 3 3 3-3"/>';b.append(svg);b.onclick=()=>active===facet?close():open(facet,b);buttons[facet]=b;document.getElementById('filters').append(b);}
function visibleViews(){return root.matchMedia('(max-width:700px)').matches?['To Review','All']:model.views;}
function responsiveViews(){document.body.classList.toggle('mobile',visibleViews().length===2);if(state&&!visibleViews().includes(state.review_view))change({review_view:'To Review'});}
if(root.soundcheckResponsiveViews)root.removeEventListener('resize',root.soundcheckResponsiveViews);root.soundcheckResponsiveViews=responsiveViews;root.addEventListener('resize',responsiveViews);responsiveViews();
document.getElementById('views').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const views=visibleViews(),index=views.indexOf(state.review_view),next=e.key==='Home'?0:e.key==='End'?views.length-1:(index+(e.key==='ArrowRight'?1:-1)+views.length)%views.length;change({review_view:views[next]});tabs[views[next]].focus();});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pill'))close();});
const search=el('div',null,'search');search.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg><input type="search" aria-label="Search artists" placeholder="Search artists…" autocomplete="off"><button type="button" aria-label="Clear search" hidden>×</button>';document.getElementById('filters').append(search);
const searchInput=search.querySelector('input'),clear=search.querySelector('button');searchInput.oninput=()=>change({query:searchInput.value});clear.onclick=()=>{searchInput.value='';change({query:''});searchInput.focus();};searchInput.onkeydown=e=>{if(e.key==='Escape'){searchInput.value='';change({query:''});}};
function choices(facet){return args[facet==='venue'?'venues':facet==='genre'?'genres':'types'];}
function selected(facet){const omitted=state['excluded_'+(facet==='venue'?'venues':facet==='genre'?'genres':'types')]||[];return choices(facet).filter(v=>!omitted.includes(v));}
function selection(facet){const list=selected(facet);return list.length===choices(facet).length?'All':list.length===0?'None selected':facet==='type'&&list.length===1&&list[0]==='Live Music'?'Live Music':`${list.length} selected`;}
function format(n,suffix='k'){return Number(n).toLocaleString('en-US')+suffix;}
function rangeSummary(range,min,max,suffix){if(!range||range[0]===min&&range[1]===max)return 'Any';if(range[1]===max)return '≥'+format(range[0],suffix);if(range[0]===min)return '≤'+format(range[1],suffix);return format(range[0],suffix)+'–'+format(range[1],suffix);}
function decisions(){return root.soundcheckFilterState?.owner===owner?root.soundcheckLiveDecisions||{}:{};}
function sync(){
 if(!args||!state)return;const c=model.counts(args.rows,state,args.limits,decisions());
 for(const [v,b] of Object.entries(tabs)){b.setAttribute('aria-selected',String(state.review_view===v));b.tabIndex=state.review_view===v?0:-1;SoundcheckMotion.roll(b.querySelector('.badge'),c.views[v]);}
 for(const facet of ['venue','genre','type']){const b=buttons[facet],summary=selection(facet);b.querySelector('.value').textContent=summary;b.querySelector('.value').classList.toggle('restricted',summary!=='All'&&!(facet==='type'&&summary==='Live Music'));}
 for(const [facet,range,min,max,suffix] of [['listeners',state.listener_range,0,args.limits.listeners,'k'],['growth',state.growth_range,args.limits.growth[0],args.limits.growth[1],'%']]){const v=buttons[facet].querySelector('.value');v.textContent=rangeSummary(range,min,max,suffix);v.classList.toggle('restricted',v.textContent!=='Any');}
 buttons.listeners.querySelector('.unknown-note').textContent=state.hide_unknown?' · Hide unknown':'';
 clear.hidden=!state.query;
 if(popover){
  if(['venue','genre','type'].includes(active))for(const input of popover.querySelectorAll('input')){const value=input.dataset.value,list=selected(active);input.checked=value==null?list.length===choices(active).length:list.includes(value);input.indeterminate=value==null&&list.length>0&&list.length<choices(active).length;SoundcheckMotion.roll(input.closest('label').querySelector('.badge'),value==null?c.totals[active]:c[active][value]||0);}
  else syncRange();
 }
 send('streamlit:setFrameHeight',{height:document.body.scrollHeight});
}
function change(update){const next={...state,...update};if(JSON.stringify(next)===JSON.stringify(state))return;state=next;revision++;root.soundcheckFilterState={owner,preferences:state,revision};root.dispatchEvent(new root.CustomEvent('soundcheck:filters'));sync();clearTimeout(timer);timer=setTimeout(()=>send('streamlit:setComponentValue',{value:{owner,preferences:state,revision},dataType:'json'}),350);}
function close(){if(popover)popover.remove();popover=null;active=null;for(const b of Object.values(buttons))b.setAttribute('aria-expanded','false');}
function open(facet,button){
 close();active=facet;button.setAttribute('aria-expanded','true');popover=doc.createElement('div');popover.className='soundcheck-filter-popover';popover.setAttribute('role','dialog');popover.setAttribute('aria-label',facet==='listeners'?'Spotify listeners':facet==='growth'?'Trending':button.querySelector('strong').textContent);doc.body.append(popover);
 if(['venue','genre','type'].includes(facet)){
  function option(value,label){const wrap=doc.createElement('label');wrap.className='option';const input=doc.createElement('input');input.type='checkbox';if(value!=null)input.dataset.value=value;const title=doc.createElement('span');title.textContent=label;const badge=doc.createElement('span');badge.className='badge';wrap.append(input,title,badge);popover.append(wrap);input.onchange=()=>{const key='excluded_'+(facet==='venue'?'venues':facet==='genre'?'genres':'types');if(value==null)change({[key]:input.checked?[]:choices(facet).slice()});else{const omitted=new Set(state[key]||[]);input.checked?omitted.delete(value):omitted.add(value);change({[key]:[...omitted]});}};}
  option(null,'All');const separator=doc.createElement('div');separator.className='separator';popover.append(separator);
  if(facet==='venue'){for(const [label,core] of [['Core venues · All shows',true],['Other venues · Select shows',false]]){const group=doc.createElement('div');group.className='group';group.textContent=label;popover.append(group);for(const value of choices(facet).filter(v=>args.core_venues.includes(v)===core))option(value,value);}}
  else for(const value of choices(facet))option(value,value);
 }else range(facet);
 sync();position(button);popover.querySelector('input')?.focus({preventScroll:true});popover.addEventListener('keydown',e=>{if(e.key==='Escape'){close();button.focus();}});
}
function position(button){
 if(!popover)return;
 const outer=window.frameElement.getBoundingClientRect(),r=button.getBoundingClientRect(),width=popover.offsetWidth,height=popover.scrollHeight;
 const below=outer.top+r.bottom+8,roomBelow=root.innerHeight-below-12,roomAbove=outer.top+r.top-20;
 const useBelow=roomBelow>=160||roomBelow>=roomAbove;
 const room=Math.max(100,useBelow?roomBelow:roomAbove);
 popover.style.maxHeight=room+'px';
 popover.style.left=Math.max(12,Math.min(outer.left+r.left,root.innerWidth-width-12))+'px';
 popover.style.top=Math.max(12,useBelow?below:outer.top+r.top-Math.min(height,room)-8)+'px';
}

function range(facet){
 const min=facet==='listeners'?0:args.limits.growth[0],max=facet==='listeners'?args.limits.listeners:args.limits.growth[1];
 const title=doc.createElement('h3');title.textContent=facet==='listeners'?'Spotify listeners':'Six-month listener growth';popover.append(title);
 const values=doc.createElement('div');values.className='range-values';values.append(doc.createElement('span'),doc.createElement('span'));popover.append(values);
 const track=doc.createElement('div');track.className='range-track';const line=doc.createElement('div');line.className='range-line';track.append(line);
 for(const [which,label] of [['low','Minimum'],['high','Maximum']]){const input=doc.createElement('input');input.type='range';input.min=min;input.max=max;input.step=facet==='listeners'?50:1;input.dataset.bound=which;input.setAttribute('aria-label',label+' '+(facet==='listeners'?'Spotify listeners':'Trending'));track.append(input);input.oninput=()=>{const key=facet==='listeners'?'listener_range':'growth_range',prior=state[key]||[min,max],val=Number(input.value),r=which==='low'?[Math.min(val,prior[1]),prior[1]]:[prior[0],Math.max(val,prior[0])];change({[key]:r[0]===min&&r[1]===max?null:r});};}popover.append(track);
 const scale=doc.createElement('div');scale.className='scale';const lo=doc.createElement('span'),hi=doc.createElement('span');lo.textContent=format(min,facet==='listeners'?'k':'%');hi.textContent=format(max,facet==='listeners'?'k':'%');scale.append(lo,hi);popover.append(scale);
 if(facet==='listeners'){const wrap=doc.createElement('label');wrap.className='option';const input=doc.createElement('input');input.type='checkbox';input.checked=state.hide_unknown;input.onchange=()=>change({hide_unknown:input.checked});const label=doc.createElement('span');label.textContent="Hide 'unknown'";wrap.append(input,label);popover.append(wrap);}
}
function syncRange(){const isListeners=active==='listeners',min=isListeners?0:args.limits.growth[0],max=isListeners?args.limits.listeners:args.limits.growth[1],r=state[isListeners?'listener_range':'growth_range']||[min,max],inputs=popover.querySelectorAll('input[type=range]'),labels=popover.querySelectorAll('.range-values span');inputs.forEach((i,n)=>{i.value=r[n];i.setAttribute('aria-valuetext',format(r[n],isListeners?'k':'%'));});labels.forEach((s,n)=>s.textContent=format(r[n],isListeners?'k':'%'));const l=(r[0]-min)/(max-min)*100,h=(r[1]-min)/(max-min)*100;popover.querySelector('.range-line').style.background=`linear-gradient(to right,#dce8e6 ${l}%,#247e79 ${l}%,#247e79 ${h}%,#dce8e6 ${h}%)`;const unknown=popover.querySelector('input[type=checkbox]');if(unknown)unknown.checked=state.hide_unknown;}
doc.addEventListener('pointerdown',e=>{if(popover&&!popover.contains(e.target))close();});root.addEventListener('soundcheck:dismiss-filter',close);root.addEventListener('soundcheck:decisions',sync);root.addEventListener('resize',()=>{if(active)position(buttons[active]);});doc.addEventListener('scroll',()=>{if(active)position(buttons[active]);},true);
window.addEventListener('pagehide',close);
window.addEventListener('message',e=>{
 if(e.data.type!=='streamlit:render')return;args=e.data.args;
 if(owner!==args.owner){close();owner=args.owner;state={...args.preferences};revision=args.revision||0;root.soundcheckLiveDecisions={};}
 else if((args.revision||0)>=revision){state={...args.preferences};revision=args.revision||0;}
 if(!model.views.includes(state.review_view))state.review_view='To Review';
 root.soundcheckFilterState={owner,preferences:state,revision};searchInput.value=state.query||'';sync();root.dispatchEvent(new root.CustomEvent('soundcheck:filters'));responsiveViews();
});new ResizeObserver(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight})).observe(document.body);send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
